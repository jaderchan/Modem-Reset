[package]
name = "modem-reset"
version = "2.0.0"
edition = "2024"
description = "中兴 F612 光猫 / 小米路由器重启工具（托盘 + CLI）"
license = "MIT"
publish = false

[[bin]]
name = "ModemReset"
path = "src/main.rs"

[dependencies]
# 只走 http，关掉 tls/gzip 能显著缩小体积（光猫和路由器都没有 https）
ureq = { version = "3.5", default-features = false }
# 不用 regex：它自带 Unicode 表和 DFA，光编进来就 1.1 MB。
# 我们的 pattern 全是 ASCII 关键字，regex-lite 够用（同批 pattern 做过差分测试）。
regex-lite = "0.1"

[build-dependencies]
# 用 rc.exe 把自绘图标和版本信息编成 Windows 资源
embed-resource = "3"
# 只给 build.rs 用：把大尺寸图标压成 PNG（ICO 允许 PNG 帧），运行时不需要
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
